name: InvoiceSync checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          echo "TEST_PG_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
          python -m pip install 'psycopg[binary]' pymupdf zxing-cpp pillow
          npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck && npm run build
      - run: npm test
        env:
          INVOICING_TEST_PYTHON: '1'
      - run: npm run test:db
      - run: python services/invoicing/tests/verify_pdf.py
