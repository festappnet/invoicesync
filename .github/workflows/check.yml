name: InvoiceSync checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          echo "TEST_PG_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
          python -m pip install 'psycopg[binary]' pymupdf zxing-cpp pillow
          pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck && pnpm run build
      - run: pnpm test
        env:
          INVOICING_TEST_PYTHON: '1'
      - run: pnpm run test:db
      - run: python services/invoicing/tests/verify_pdf.py
